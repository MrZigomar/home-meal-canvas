name: Update Google Reviews

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC (7-8h heure de Paris selon la saison)
  workflow_dispatch: {}    # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write
  actions: write   # nécessaire pour pouvoir déclencher le workflow de déploiement

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-reviews.mjs

      - name: Commit updated reviews.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/reviews.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: mise à jour des avis Google"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec le GITHUB_TOKEN par défaut ne déclenche PAS
      # automatiquement le workflow "Deploy site" (règle anti-boucle de GitHub).
      # On le déclenche donc explicitement ici, uniquement si le JSON a changé.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
